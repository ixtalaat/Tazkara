<div class="auth-wrapper animated-fade-in">
  <div class="glass-panel auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to Tazkara to access tickets and dashboard</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          id="email"
          type="email" 
          formControlName="email" 
          class="form-control" 
          placeholder="you@example.com"
          [disabled]="loading"
        />
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="validation-error">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          id="password"
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="••••••••"
          [disabled]="loading"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="validation-error">
          Password must be at least 6 characters.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      New to Tazkara? <a routerLink="/register">Create an account</a>
    </div>
  </div>
</div>
