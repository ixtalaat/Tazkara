<div class="auth-wrapper animated-fade-in">
  <div class="glass-panel auth-card">
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join Tazkara to browse events, book tickets, and manage bookings</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-banner">
      {{ successMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group col">
          <label class="form-label" for="firstName">First Name</label>
          <input 
            id="firstName"
            type="text" 
            formControlName="firstName" 
            class="form-control" 
            placeholder="John"
            [disabled]="loading"
          />
          <div *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid" class="validation-error">
            Required.
          </div>
        </div>

        <div class="form-group col">
          <label class="form-label" for="lastName">Last Name</label>
          <input 
            id="lastName"
            type="text" 
            formControlName="lastName" 
            class="form-control" 
            placeholder="Doe"
            [disabled]="loading"
          />
          <div *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid" class="validation-error">
            Required.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          id="email"
          type="email" 
          formControlName="email" 
          class="form-control" 
          placeholder="john.doe@example.com"
          [disabled]="loading"
        />
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="validation-error">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          id="password"
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="••••••••"
          [disabled]="loading"
        />
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="validation-error">
          Password must be at least 8 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">I want to register as a:</label>
        <div class="role-selector">
          <label class="role-option" [class.selected]="registerForm.get('role')?.value === 'Customer'">
            <input type="radio" formControlName="role" value="Customer" class="hidden-radio" />
            <span>Customer</span>
          </label>
          <label class="role-option" [class.selected]="registerForm.get('role')?.value === 'Organizer'">
            <input type="radio" formControlName="role" value="Organizer" class="hidden-radio" />
            <span>Organizer</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="registerForm.invalid || loading">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Sign In</a>
    </div>
  </div>
</div>
